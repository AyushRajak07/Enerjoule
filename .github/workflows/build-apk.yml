name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Create signing keystore (if none supplied via secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/release.keystore
            echo "Using keystore from repository secret."
          else
            keytool -genkeypair -v -keystore android/release.keystore \
              -alias smartenergy -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass smartenergy -keypass smartenergy \
              -dname "CN=Smart Energy, OU=App, O=Smart Energy, C=IN"
            echo "Generated a temporary keystore (add KEYSTORE_BASE64 secret to keep a stable signature)."
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'smartenergy' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'smartenergy' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'smartenergy' }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SmartEnergy.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergy-apk
          path: SmartEnergy.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (latest)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Smart Energy (latest build)
          body: "Automatically built APK. Download SmartEnergy.apk below and install it on your Android phone."
          files: SmartEnergy.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
